apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:1.8
        ports:
        - containerPort: 2020
          name: api
        # Additional volume mounts or configMaps can be added for custom configuration
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
spec:
  selector:
    app: fluent-bit
  ports:
  - port: 2020
    targetPort: 2020
  type: ClusterIP
